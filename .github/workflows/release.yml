name: Release

on:
  release:
    types: [published]

# homelab: GitHub made the default workflow token read-only, and the old actions
# (checkout@v2 / setup-python@v1 / upload-release-action@v1-release) are deprecated,
# which broke the automatic zip upload. This is our maintained release.yml on the
# homelab branch: modern actions + explicit contents:write so a new release builds and
# attaches mikrotik_router.zip automatically (no more manual upload). Release notes are
# written by hand in the GitHub release body (auto-releasenotes step dropped).
permissions:
  contents: write

jobs:
  release_zip:
    name: Build and upload release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip mikrotik_router dir
        run: |
          cd custom_components/mikrotik_router
          zip -r mikrotik_router.zip ./ -x '*__pycache__*' -x '*.pyc'

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/mikrotik_router/mikrotik_router.zip
