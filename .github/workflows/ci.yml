name: CI

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  black:
    name: Python Code Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Black Code Format Check
        run: |
          python -m pip install --upgrade pip black
          black . --check --fast --diff

  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --ignore W503,E722,F722 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  security:
    name: Security check - Bandit
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Bandit
        run: |
          python -m pip install --upgrade pip bandit
          mkdir -p output
          bandit -r custom_components/mikrotik_router -ll -f txt | tee output/security_report.txt
      - name: Security check report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Security report
          path: output/security_report.txt

  validate:
    name: Check hassfest
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
